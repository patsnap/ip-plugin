<section class="report-cover report-editorial-cover" id="report-cover">
  $brand
  <div class="report-conclusion $tone" id="report-primary-conclusion">
    <div class="report-conclusion-label">$conclusion_label</div>
    <div class="report-conclusion-body">
      <div data-report-conclusion-copy>
        <h2>$headline</h2>
        <p class="report-conclusion-scope">$date_label</p>
        <div class="report-cover-intro"><div class="report-risk-grid">$cards</div><p class="report-risk-caption">$risk_note</p></div>
        <div class="report-statistics-grid">$stats</div>
        <div class="report-cover-subject">
          <h2>$scope_heading</h2>
          $scope_description
          <span>$scheme_label</span>
          <strong>$solution_name</strong>
          <p>$solution_description</p>
        </div>
        $notice
        <div class="report-reasons">
          $reasons
          <section class="report-cover-next-step">
            <h3 class="report-reason-heading">
              <span class="report-reason-number" aria-hidden="true">03</span>
              <span class="report-reason-name">$recommendation_label</span>
            </h3>
            <div class="report-prose">$recommendation_body</div>
          </section>
        </div>
      </div>
    </div>
  </div>
  $overview
</section>
