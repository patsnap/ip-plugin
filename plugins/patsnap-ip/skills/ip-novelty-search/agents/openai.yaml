interface:
  display_name: "Novelty Search"
  short_description: "Assess a complete technical disclosure against prior patents, compare its features, verify decisive evidence, and report novelty and inventive step separately in a traceable HTML report. Supports continuation of an existing search."
  icon_small: "./assets/eureka-logo.png"
  icon_large: "./assets/eureka-logo.png"
  brand_color: "#0066CC"
  default_prompt: "Use $ip-novelty-search to find the closest prior patents for [technical solution], compare features, assess novelty and inventive step separately, and identify issues requiring verification."
policy:
  allow_implicit_invocation: true
