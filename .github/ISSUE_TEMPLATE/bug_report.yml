name: 问题报告 / Bug report
description: 报告可公开的问题 / Report a public bug
body:
  - type: input
    id: environment
    attributes:
      label: 客户端、版本和分支 / Client, version, and branch
      placeholder: Codex, plugin 0.10.5, main
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤和实际结果 / Steps and actual result
      description: 请提供脱敏信息。安全漏洞请使用 SECURITY.md 中的私下报告渠道。 Include only redacted information. For security issues, use the private route in SECURITY.md.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
